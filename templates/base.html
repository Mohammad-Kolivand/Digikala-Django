<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Digikala{% endblock %}</title>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'store-list' %}">Stores</a>

            {% if user.is_authenticated %}
                <span>
                    Hello {{ user.first_name|default:user.username }}
                </span>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'singu' %}">Sign up</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>All rights reserved.</p>
    </footer>
</body>
</html>
